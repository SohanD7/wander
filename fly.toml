# Deploy:  fly launch --no-deploy --copy-config   (pick a unique app name)
#          fly volumes create wander_data --size 1
#          fly deploy
app = "wander-prototype"
primary_region = "sea"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "wander_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # live rooms live in memory; keep one machine running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
